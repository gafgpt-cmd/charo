name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Charo CLI behavior
        run: tests/charo-cli.sh

      # Shell scripts are found by shebang rather than a hard-coded list, so a
      # newly added script is checked without editing this workflow.
      - name: ShellCheck
        run: |
          set -eu
          files=$(grep -rl '^#!/bin/sh' bin contrib/git-hooks tests install.sh || true)
          if [ -z "$files" ]; then
            echo "no shell scripts found - this workflow is looking in the wrong place"
            exit 1
          fi
          echo "$files"
          # shellcheck disable=SC2086
          shellcheck -S style $files

      - name: Python syntax
        run: |
          set -eu
          files=$(grep -rl '^#!/usr/bin/env python3' bin || true)
          for file in $files; do
            echo "$file"
            python3 -m py_compile "$file"
          done

      - name: Executable bits
        run: |
          set -eu
          status=0
          for file in $(grep -rl '^#!' bin contrib/git-hooks tests install.sh || true); do
            if [ ! -x "$file" ]; then
              echo "not executable: $file"
              status=1
            fi
          done
          exit "$status"
